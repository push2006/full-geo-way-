<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoWatch Pro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080f; --bg2:#0a101c; --panel:#0e1626; --panel2:#141e31; --elev:#182338;
  --line:#1a2740; --line2:#243656;
  --acc:#4f8cff; --acc2:#2dd4bf; --acc-glow:rgba(79,140,255,.25);
  --warn:#fbbf24; --danger:#f87171; --ok:#34d399; --violet:#c4b5fd;
  --text:#eef3fb; --dim:#8b9bb8; --muted:#5c6d8a;
  --r:14px; --font:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
html[data-theme="light"]{
  --bg:#f0f3f9; --bg2:#e6ebf5; --panel:#ffffff; --panel2:#f5f7fc; --elev:#eef1f8;
  --line:#d0d9ea; --line2:#b7c4db;
  --acc:#2563eb; --acc2:#0d9488; --acc-glow:rgba(37,99,235,.15);
  --text:#0f172a; --dim:#475569; --muted:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); font-size:14px; color:var(--text); line-height:1.5;
  background:
    radial-gradient(900px 420px at 8% -8%, rgba(79,140,255,.12), transparent 55%),
    radial-gradient(700px 380px at 100% 0%, rgba(45,212,191,.07), transparent 50%),
    var(--bg);
  min-height:100vh;
}
a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
button{
  font-family:var(--font); cursor:pointer; border-radius:10px; border:1px solid var(--line);
  background:var(--panel2); color:var(--text); padding:8px 14px; font-size:13px; font-weight:500;
  transition:border-color .15s, background .15s, transform .1s, box-shadow .15s;
}
button:hover{border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-glow)}
button:active{transform:scale(.98)}
button.primary{background:linear-gradient(135deg,var(--acc),#3b6fd9); border-color:transparent; color:#fff; font-weight:600}
button.primary:hover{filter:brightness(1.06)}
button.chip{border-radius:999px; padding:6px 12px; font-size:12px; background:transparent}
button.chip.on{background:var(--acc); border-color:var(--acc); color:#fff; box-shadow:0 4px 14px var(--acc-glow)}
input{
  width:100%; font-family:var(--font); font-size:13px; color:var(--text);
  background:var(--elev); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
}
input:focus{outline:none; border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-glow)}
input::placeholder{color:var(--muted)}

/* Shell */
.shell{display:grid; grid-template-columns:220px 1fr; min-height:100vh}
@media(max-width:900px){.shell{grid-template-columns:1fr}}

/* Sidebar */
.side{
  background:rgba(10,16,28,.92); border-right:1px solid var(--line);
  padding:18px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:18px;
  backdrop-filter:blur(12px);
}
html[data-theme="light"] .side{background:rgba(255,255,255,.95)}
@media(max-width:900px){
  .side{position:relative; height:auto; border-right:0; border-bottom:1px solid var(--line)}
}
.brand{display:flex; gap:10px; align-items:center; padding:4px 6px}
.logo{
  width:38px; height:38px; border-radius:12px; display:grid; place-items:center;
  font-weight:700; font-size:13px; color:#fff;
  background:linear-gradient(145deg,var(--acc),var(--acc2));
  box-shadow:0 8px 20px var(--acc-glow);
}
.brand h1{font-size:15px; font-weight:700; letter-spacing:-.02em}
.brand h1 small{display:block; font-size:11px; color:var(--dim); font-weight:400; margin-top:1px}
.nav{display:flex; flex-direction:column; gap:4px}
.nav .tab{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  color:var(--dim); cursor:pointer; font-weight:500; font-size:13px; user-select:none;
  border:1px solid transparent;
}
.nav .tab:hover{background:var(--panel2); color:var(--text)}
.nav .tab.on{background:linear-gradient(135deg,rgba(79,140,255,.18),rgba(45,212,191,.08));
  color:var(--text); border-color:rgba(79,140,255,.25)}
.nav .tab .ico{width:18px; text-align:center; opacity:.9}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:8px}
.side-foot .meta{font-size:11px; color:var(--muted); padding:0 8px; font-family:var(--mono)}

/* Main */
.main{padding:18px 20px 40px; max-width:1100px}
.topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.topbar h2{font-size:18px; font-weight:700; letter-spacing:-.02em}
.actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
#refresh-note{font-size:12px; color:var(--muted); font-family:var(--mono)}
.pulse{width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 rgba(52,211,153,.5); animation:pulse 2s infinite}
.pulse.off{background:var(--muted); animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.45)}70%{box-shadow:0 0 0 10px transparent}}

/* Status + stats */
.status-bar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
.pill{
  font-size:11px; color:var(--dim); background:var(--panel); border:1px solid var(--line);
  border-radius:999px; padding:6px 11px; font-family:var(--mono);
}
.pill b{color:var(--text); font-weight:600}
.pill.on{border-color:rgba(52,211,153,.35); color:#6ee7b7}
.pill.off{opacity:.65}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:14px 16px; position:relative; overflow:hidden;
}
.stat::before{
  content:""; position:absolute; inset:0 auto auto 0; width:100%; height:2px;
  background:linear-gradient(90deg,var(--acc),var(--acc2)); opacity:.7;
}
.stat .n{font-size:26px; font-weight:700; letter-spacing:-.03em; font-family:var(--mono)}
.stat .n.a{color:var(--acc)} .stat .n.c{color:var(--acc2)} .stat .n.o{color:var(--ok)} .stat .n.w{color:var(--warn)}
.stat .l{font-size:11px; color:var(--dim); margin-top:4px; text-transform:uppercase; letter-spacing:.04em}

.panel{display:none} .panel.on{display:block; animation:in .2s ease}
@keyframes in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
.toolbar input{max-width:260px; flex:1}
.filters{display:flex; gap:6px; flex-wrap:wrap}
.count{margin-left:auto; font-size:12px; color:var(--muted); font-family:var(--mono)}

.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:13px 15px; margin-bottom:8px; transition:border-color .15s, box-shadow .15s;
}
.card:hover{border-color:var(--line2); box-shadow:0 8px 24px rgba(0,0,0,.18)}
.card .t{font-weight:600; margin-bottom:6px; line-height:1.35; font-size:14px}
.card .m{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:11px; color:var(--dim)}
.preview{margin-top:8px; color:var(--dim); font-size:13px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}

.tag{
  display:inline-flex; align-items:center; border-radius:999px; padding:2px 8px;
  border:1px solid var(--line2); background:var(--elev); color:var(--acc2); font-size:10px;
  font-weight:500; letter-spacing:.02em; text-transform:uppercase;
}
.tag.crit{color:#fecaca; border-color:rgba(248,113,113,.4); background:rgba(248,113,113,.1)}
.tag.brics{color:#ddd6fe; border-color:rgba(196,181,253,.4); background:rgba(196,181,253,.1)}
.tag.ok{color:#a7f3d0; border-color:rgba(52,211,153,.35); background:rgba(52,211,153,.1)}
.tag.warn{color:#fde68a; border-color:rgba(251,191,36,.35); background:rgba(251,191,36,.1)}
.score{font-family:var(--mono); color:var(--warn); font-weight:600}

.empty,.error{text-align:center; padding:48px 20px; color:var(--muted)}
.error{color:var(--danger); border:1px solid rgba(248,113,113,.3); border-radius:var(--r); background:rgba(248,113,113,.06)}

.bar-row{display:flex; align-items:center; gap:8px; margin:8px 0; font-size:12px}
.bar-label{width:110px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar-track{flex:1; height:10px; background:var(--elev); border-radius:6px; overflow:hidden}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--acc),var(--acc2)); border-radius:6px}
.bar-count{width:36px; text-align:right; color:var(--dim); font-family:var(--mono)}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media(max-width:800px){.two{grid-template-columns:1fr}}

.stream-form{
  display:grid; grid-template-columns:1fr 1fr 2fr auto; gap:8px; margin-bottom:14px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px;
}
.stream-form .hint{grid-column:1/-1; font-size:12px; color:var(--dim)}
.stream-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px}
.stream-card{position:relative; margin:0}
.stream-card .rm{
  position:absolute; top:10px; right:10px; z-index:2; font-size:11px; padding:4px 8px;
  background:rgba(0,0,0,.75); color:#fecaca; border:1px solid rgba(248,113,113,.4);
}
.stream-card iframe{width:100%; height:220px; border:0; border-radius:10px; margin-top:8px; background:#000}
@media(max-width:720px){.stream-form{grid-template-columns:1fr}.toolbar input{max-width:none}}
.map-wrap{height:420px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;background:var(--elev)}
#map{height:100%;width:100%}
.leaflet-container{background:var(--elev);font-family:var(--font)}

</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo">GW</div>
      <h1>GeoWatch<small>intelligence monitor</small></h1>
    </div>
    <nav class="nav">
      <div class="tab on" data-tab="content"><span class="ico">◉</span> Feed</div>
      <div class="tab" data-tab="sources"><span class="ico">◎</span> Sources</div>
      <div class="tab" data-tab="changes"><span class="ico">△</span> Changes</div>
      <div class="tab" data-tab="breakdown"><span class="ico">▦</span> Breakdown</div>
      <div class="tab" data-tab="weekly"><span class="ico">▣</span> Weekly</div>
      <div class="tab" data-tab="map"><span class="ico">🌐</span> Map</div>
      <div class="tab" data-tab="streams"><span class="ico">▶</span> Live Streams</div>
    </nav>
    <div class="side-foot">
      <div class="meta" id="side-status">collector —</div>
      <button onclick="toggleTheme()">◐ Theme</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h2 id="page-title">Feed</h2>
      <div class="actions">
        <span id="pulse" class="pulse"></span>
        <span id="refresh-note">—</span>
        <label style="display:flex;gap:6px;align-items:center;color:var(--dim);font-size:12px">
          <input type="checkbox" id="auto-refresh" checked style="width:auto"> Auto
        </label>
        <button onclick="exportJson()">⬇ Export</button>
        <button onclick="loadAll()">↻ Refresh</button>
      </div>
    </div>

    <div class="status-bar" id="status-bar"></div>
    <div class="stats" id="stats"></div>

    <div class="panel on" id="panel-content"><div class="empty">Loading feed…</div></div>
    <div class="panel" id="panel-sources"><div class="empty">Loading…</div></div>
    <div class="panel" id="panel-changes"><div class="empty">Loading…</div></div>
    <div class="panel" id="panel-breakdown"><div class="empty">Loading…</div></div>
    <div class="panel" id="panel-weekly"><div class="empty">Loading…</div></div>
    <div class="panel" id="panel-map"><div class="empty">Loading map…</div></div>
    <div class="panel" id="panel-streams"><div class="empty">Loading…</div></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const titles={content:'Feed',sources:'Sources',changes:'Changes',breakdown:'Breakdown',weekly:'Weekly',map:'Map',streams:'Live Streams'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=(s,n=160)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
const timeAgo=iso=>{if(!iso)return '';const t=new Date(iso).getTime();if(isNaN(t))return esc(String(iso));
  const d=Math.max(0,(Date.now()-t)/1000);if(d<60)return Math.floor(d)+'s';if(d<3600)return Math.floor(d/60)+'m';
  if(d<86400)return Math.floor(d/3600)+'h';return Math.floor(d/86400)+'d'};
async function fetchJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(u+' → '+r.status);return r.json()}
function toggleTheme(){const h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark');localStorage.setItem('gw-theme',h.getAttribute('data-theme'))}
(function(){const s=localStorage.getItem('gw-theme');if(s)document.documentElement.setAttribute('data-theme',s)})();

document.querySelectorAll('.nav .tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.nav .tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); $('panel-'+t.dataset.tab).classList.add('on');
  $('page-title').textContent=titles[t.dataset.tab]||'GeoWatch';
}));

let CACHE={content:[],sources:[],changes:[],contentTotal:0,contentHasMore:false};
let FILTER='all'; let CONTENT_SKIP=0; const CONTENT_PAGE=100;

async function loadStatus(){
  try{
    const s=await fetchJSON('/api/status'); const f=s.features||{};
    const run=!!s.running; $('pulse').className='pulse'+(run?'':' off');
    $('side-status').textContent=(run?'live':'idle')+' · cycle #'+(s.last_cycle_num||0);
    $('status-bar').innerHTML=`
      <span class="pill ${run?'on':''}"><b>${run?'Collector live':'Idle'}</b></span>
      <span class="pill">#${s.last_cycle_num||0} · ${s.last_cycle_at?timeAgo(s.last_cycle_at)+' ago':'—'}</span>
      <span class="pill">Δ ${s.last_changed??0} · err ${s.last_errors??0} · ${s.last_duration_sec??0}s</span>
      <span class="pill ${f.gnews?'on':'off'}">GNews</span>
      <span class="pill ${f.sanctions?'on':'off'}">OFAC</span>
      <span class="pill ${f.tor?'on':'off'}">Tor</span>
      <span class="pill">DB ${esc(f.storage||'sqlite')}${f.mongo_targets?` ×${f.mongo_targets}`:''}</span>`;
  }catch(e){$('status-bar').innerHTML='<span class="pill">Status offline</span>'}
}

async function loadStats(){
  try{
    const s=await fetchJSON('/api/summary');
    const plats=Object.keys(s.by_platform||{}).length, cats=Object.keys(s.by_category||{}).length;
    $('stats').innerHTML=`
      <div class="stat"><div class="n a">${s.total_sources??0}</div><div class="l">Items</div></div>
      <div class="stat"><div class="n c">${s.total_changes_logged??0}</div><div class="l">Changes</div></div>
      <div class="stat"><div class="n o">${plats}</div><div class="l">Platforms</div></div>
      <div class="stat"><div class="n w">${cats}</div><div class="l">Categories</div></div>`;
  }catch(e){$('stats').innerHTML=`<div class="error">${esc(e.message)}</div>`}
}

function isCritical(it){if(it.critical)return true;const b=[it.title,it.name,it.content_preview,it.category].join(' ').toLowerCase();return /sanction|invasion|missile|nuclear|ceasefire|airstrike|martial law/.test(b)}
function isBrics(it){if(it.brics)return true;const b=[it.title,it.name,it.content_preview,it.category].join(' ').toLowerCase();return /brics|new development bank|global south/.test(b)}

function renderContent(){
  const el=$('panel-content'); const q=($('q-content')?.value||'').toLowerCase().trim();
  let items=CACHE.content||[];
  if(FILTER==='critical')items=items.filter(isCritical);
  if(FILTER==='brics')items=items.filter(isBrics);
  if(FILTER==='high')items=items.filter(it=>(it.score||0)>=5);
  if(q)items=items.filter(it=>[it.title,it.name,it.category,it.platform,it.content_preview,it.url].join(' ').toLowerCase().includes(q));
  const rows=items.slice(0,500).map(it=>{
    const title=it.title||it.name||it.url||'Untitled';
    const preview=it.content_preview||it.content||'';
    const tags=[it.category&&`<span class="tag">${esc(it.category)}</span>`,it.platform&&`<span class="tag">${esc(it.platform)}</span>`,
      it.source_type&&`<span class="tag">${esc(it.source_type)}</span>`,isCritical(it)&&`<span class="tag crit">critical</span>`,
      isBrics(it)&&`<span class="tag brics">brics</span>`,(it.score||0)>0&&`<span class="score">${it.score}</span>`].filter(Boolean).join('');
    return `<div class="card"><div class="t"><a href="${esc(it.url||'#')}" target="_blank" rel="noopener">${esc(title)}</a></div>
      <div class="m">${tags}<span>${timeAgo(it.updated_at||it.last_changed||it.last_checked)} ago</span></div>
      ${preview?`<div class="preview">${esc(short(preview,240))}</div>`:''}</div>`;
  }).join('');
  el.innerHTML=`<div class="toolbar">
    <input id="q-content" placeholder="Search feed…" value="${esc($('q-content')?.value||'')}" oninput="renderContent()">
    <div class="filters">
      <button class="chip ${FILTER==='all'?'on':''}" onclick="setFilter('all')">All</button>
      <button class="chip ${FILTER==='critical'?'on':''}" onclick="setFilter('critical')">Critical</button>
      <button class="chip ${FILTER==='brics'?'on':''}" onclick="setFilter('brics')">BRICS</button>
      <button class="chip ${FILTER==='high'?'on':''}" onclick="setFilter('high')">High score</button>
    </div>
    <span class="count">${items.length}${CACHE.contentTotal?` / ${CACHE.contentTotal}`:''}</span>
  </div>${rows||'<div class="empty">No items — wait for a collection cycle or clear filters.</div>'}
  ${CACHE.contentHasMore?`<div style="text-align:center;margin:14px 0"><button class="primary" onclick="loadContent(false)">Load more</button></div>`:''}`;
}
function setFilter(f){FILTER=f;renderContent()}

async function loadContent(reset=true){
  try{
    if(reset){CONTENT_SKIP=0;CACHE.content=[]}
    const data=await fetchJSON('/api/content?limit='+CONTENT_PAGE+'&skip='+CONTENT_SKIP);
    const items=Array.isArray(data)?data:(data.items||[]);
    const total=Array.isArray(data)?items.length:(data.total||items.length);
    if(reset)CACHE.content=items; else CACHE.content=CACHE.content.concat(items);
    CACHE.contentTotal=total; CACHE.contentHasMore=Array.isArray(data)?false:!!data.has_more;
    CONTENT_SKIP=CACHE.content.length; renderContent();
  }catch(e){$('panel-content').innerHTML=`<div class="error">${esc(e.message)}</div>`}
}

function renderSources(){
  const el=$('panel-sources'); const q=($('q-sources')?.value||'').toLowerCase().trim();
  let items=CACHE.sources||[];
  if(q)items=items.filter(it=>[it.name,it.url,it.category,it.platform,it.source_type].join(' ').toLowerCase().includes(q));
  const rows=items.map(it=>{
    const name=it.name||it.title||it.url||'Source';
    return `<div class="card"><div class="t"><a href="${esc(it.url||'#')}" target="_blank" rel="noopener">${esc(name)}</a></div>
      <div class="m">${it.enabled!==false?'<span class="tag ok">on</span>':'<span class="tag warn">off</span>'}
      ${it.category?`<span class="tag">${esc(it.category)}</span>`:''}
      ${it.source_type?`<span class="tag">${esc(it.source_type)}</span>`:''}
      <span>${timeAgo(it.last_checked||it.updated_at)} ago</span>
      ${it.last_status?`<span>HTTP ${esc(it.last_status)}</span>`:''}</div>
      ${it.error||it.error_message?`<div class="preview" style="color:var(--danger)">${esc(short(it.error||it.error_message,160))}</div>`:''}</div>`;
  }).join('');
  el.innerHTML=`<div class="toolbar"><input id="q-sources" placeholder="Filter sources…" value="${esc($('q-sources')?.value||'')}" oninput="renderSources()"><span class="count">${items.length}</span></div>${rows||'<div class="empty">No sources yet.</div>'}`;
}
async function loadSources(){try{CACHE.sources=await fetchJSON('/api/sites');renderSources()}catch(e){$('panel-sources').innerHTML=`<div class="error">${esc(e.message)}</div>`}}

async function loadChanges(){
  try{
    CACHE.changes=await fetchJSON('/api/changes');
    const rows=(CACHE.changes||[]).map(c=>`<div class="card"><div class="t"><a href="${esc(c.url||'#')}" target="_blank" rel="noopener">${esc(c.title||c.url||'Change')}</a></div>
      <div class="m"><span class="tag warn">changed</span><span>${timeAgo(c.detected_at)} ago</span></div>
      ${c.content_preview?`<div class="preview">${esc(short(c.content_preview,200))}</div>`:''}</div>`).join('');
    $('panel-changes').innerHTML=rows||'<div class="empty">No changes yet.</div>';
  }catch(e){$('panel-changes').innerHTML=`<div class="error">${esc(e.message)}</div>`}
}

async function loadBreakdown(){
  try{
    const s=await fetchJSON('/api/summary');
    const mk=(obj,title)=>{const e=Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]);const max=Math.max(1,...e.map(x=>x[1]));
      return `<div class="card"><div class="t">${title}</div>${e.map(([k,v])=>`<div class="bar-row"><div class="bar-label" title="${esc(k)}">${esc(k)}</div><div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%"></div></div><div class="bar-count">${v}</div></div>`).join('')||'<div class="empty">No data</div>'}</div>`};
    $('panel-breakdown').innerHTML=`<div class="two">${mk(s.by_platform,'Platform')}${mk(s.by_category,'Category')}</div>`;
  }catch(e){$('panel-breakdown').innerHTML=`<div class="error">${esc(e.message)}</div>`}
}

async function loadWeekly(){
  try{
    const data=await fetchJSON('/api/weekly'); const cats=data.categories||{};
    const max=Math.max(1,...Object.values(cats).map(Number));
    const bars=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([k,v])=>`<div class="bar-row"><div class="bar-label">${esc(k)}</div><div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%"></div></div><div class="bar-count">${v}</div></div>`).join('');
    const top=(data.top||[]).map(a=>`<div class="card"><div class="t"><a href="${esc(a.url||'#')}" target="_blank" rel="noopener">${esc(a.title||a.name||'Article')}</a></div>
      <div class="m">${a.category?`<span class="tag">${esc(a.category)}</span>`:''}<span class="score">${a.score??0}</span></div></div>`).join('')||'<div class="empty">No weekly data.</div>';
    $('panel-weekly').innerHTML=`<div class="two"><div class="card"><div class="t">Categories · 7d</div>${bars||'—'}</div><div><div class="t" style="margin-bottom:8px;font-weight:600">Top stories</div>${top}</div></div>`;
  }catch(e){$('panel-weekly').innerHTML=`<div class="error">${esc(e.message)}</div>`}
}

async function loadStreams(){
  try{
    const streams=await fetchJSON('/api/streams');
    const form=`<div class="stream-form"><input id="st-name" placeholder="Name"><input id="st-country" placeholder="Label" value="Custom"><input id="st-link" placeholder="YouTube live / watch URL"><button class="primary" onclick="addStream()">Add live</button><div class="hint">Paste youtube.com/watch · /live/ · youtu.be · embed links</div></div>`;
    const cards=streams.length?`<div class="stream-grid">`+streams.map(s=>`<div class="card stream-card"><button class="rm" onclick='removeStream(${JSON.stringify(s.name)})'>Remove</button><div class="t">${esc(s.name)} <span class="tag">${esc(s.country||'')}</span></div>${s.embed_url?`<iframe src="${esc(s.embed_url)}" title="${esc(s.name)}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><div class="m" style="margin-top:6px"><a href="${esc(s.watch_url||'')}" target="_blank" rel="noopener">YouTube ↗</a></div>`:''}</div>`).join('')+`</div>`:'<div class="empty">Add a YouTube live link above.</div>';
    $('panel-streams').innerHTML=form+cards;
  }catch(e){$('panel-streams').innerHTML=`<div class="error">${esc(e.message)}</div>`}
}
async function addStream(){
  const name=$('st-name').value.trim(), country=$('st-country').value.trim()||'Custom', link=$('st-link').value.trim();
  if(!name||!link){alert('Name and link required');return}
  const r=await fetch('/api/streams',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,country,link})});
  const d=await r.json(); if(!d.ok){alert(d.error||'Failed');return} await loadStreams();
}
async function removeStream(name){
  if(!confirm('Remove "'+name+'"?'))return;
  const r=await fetch('/api/streams/'+encodeURIComponent(name),{method:'DELETE'});
  const d=await r.json(); if(!d.ok){alert(d.error||'Failed');return} await loadStreams();
}


let mapInst=null, mapLayer=null;
async function loadMap(){
  const el=$('panel-map');
  try{
    const data=await fetchJSON('/api/geo');
    const points=data.points||[];
    el.innerHTML=`<div class="map-wrap"><div id="map"></div></div>
      <div class="card" style="margin-top:12px"><div class="t">Regions · ${data.total_regions||points.length}</div>
      <div class="m" style="margin-top:8px;flex-direction:column;align-items:stretch;gap:6px">
      ${points.slice(0,20).map(p=>`<div class="bar-row"><div class="bar-label">${esc(p.name)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,((p.enabled||0)+(p.items||0))*8)}%"></div></div>
        <div class="bar-count">${(p.enabled||0)}/${(p.sources||0)}</div></div>`).join('')||'—'}
      </div></div>`;
    // init leaflet after DOM
    setTimeout(()=>{
      if(mapInst){ mapInst.remove(); mapInst=null; }
      mapInst=L.map('map',{worldCopyJump:true}).setView([20,10],2);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
        attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:8
      }).addTo(mapInst);
      points.forEach(p=>{
        if(p.lon==null||p.lat==null) return;
        const r=Math.max(6, Math.min(22, 6+(p.enabled||0)*2+(p.items||0)*0.01));
        const mark=L.circleMarker([p.lat,p.lon],{
          radius:r, color:'#4f8cff', weight:1, fillColor:'#2dd4bf', fillOpacity:0.55
        }).addTo(mapInst);
        mark.bindPopup(`<b>${esc(p.name)}</b><br>Sources on: ${p.enabled||0}/${p.sources||0}<br>Items: ${p.items||0}`);
      });
    }, 50);
  }catch(e){ el.innerHTML=`<div class="error">${esc(e.message)}</div>`; }
}

async function exportJson(){
  try{
    const data=await fetchJSON('/api/export?limit=5000');
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='geowatch-export.json';
    a.click();
    URL.revokeObjectURL(a.href);
  }catch(e){ alert('Export failed: '+e.message); }
}

async function loadAll(){
  $('refresh-note').textContent='…';
  await Promise.all([loadStatus(),loadStats(),loadContent(true),loadSources(),loadChanges(),loadBreakdown(),loadWeekly(),loadMap(),loadStreams()]);
  $('refresh-note').textContent=new Date().toLocaleTimeString();
}
loadAll();
setInterval(()=>{if($('auto-refresh')?.checked)loadAll()},30000);
</script>
