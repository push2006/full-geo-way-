<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoWatch Pro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060a12; --panel:#0e1626; --panel2:#141e31; --elev:#1a2438;
  --line:#1c2a44; --line2:#2a3b5c;
  --acc:#4f8cff; --acc2:#2dd4bf; --glow:rgba(79,140,255,.28);
  --warn:#fbbf24; --danger:#f87171; --ok:#34d399; --violet:#c4b5fd;
  --text:#eef3fb; --dim:#8b9bb8; --muted:#5c6d8a;
  --r:12px; --font:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --shadow:0 8px 28px rgba(0,0,0,.32);
}
html[data-theme="light"]{
  --bg:#eef2f8; --panel:#fff; --panel2:#f5f7fc; --elev:#e8edf7;
  --line:#d0d9ea; --line2:#b7c4db;
  --acc:#2563eb; --acc2:#0d9488; --glow:rgba(37,99,235,.16);
  --text:#0f172a; --dim:#475569; --muted:#64748b;
  --shadow:0 8px 28px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); font-size:13px; color:var(--text); line-height:1.45;
  background:
    radial-gradient(900px 420px at 5% -8%, rgba(79,140,255,.12), transparent 55%),
    radial-gradient(700px 360px at 100% 0%, rgba(45,212,191,.07), transparent 50%),
    var(--bg);
  min-height:100vh;
}
a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
button,.btn{
  font-family:var(--font); cursor:pointer; border-radius:9px; border:1px solid var(--line);
  background:var(--panel2); color:var(--text); padding:7px 12px; font-size:12px; font-weight:500;
  transition:.15s; display:inline-flex; align-items:center; gap:5px;
}
button:hover{border-color:var(--acc); box-shadow:0 0 0 3px var(--glow)}
button:active{transform:scale(.98)}
button.primary{background:linear-gradient(135deg,var(--acc),#3b6fd9); border:0; color:#fff; font-weight:600}
button.chip{border-radius:999px; padding:5px 11px; font-size:11px; background:transparent; color:var(--dim)}
button.chip.on{background:rgba(79,140,255,.16); border-color:rgba(79,140,255,.45); color:var(--text); font-weight:600}
select, input[type=search], input[type=text], input[type=url]{
  background:var(--elev); border:1px solid var(--line); color:var(--text);
  border-radius:9px; padding:7px 10px; font:inherit; outline:none;
}
select:focus, input:focus{border-color:var(--acc); box-shadow:0 0 0 3px var(--glow)}
input::placeholder{color:var(--muted)}
select{cursor:pointer}

.shell{display:grid; grid-template-columns:210px 1fr; min-height:100vh}
@media(max-width:900px){.shell{grid-template-columns:1fr}}
.side{
  background:rgba(10,16,28,.95); border-right:1px solid var(--line);
  padding:16px 12px; position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; gap:14px; backdrop-filter:blur(12px); z-index:30;
}
html[data-theme="light"] .side{background:rgba(255,255,255,.97)}
@media(max-width:900px){.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
.brand{display:flex; gap:9px; align-items:center; padding:2px 4px}
.logo{
  width:36px; height:36px; border-radius:10px; display:grid; place-items:center;
  font-weight:700; font-size:12px; color:#fff;
  background:linear-gradient(145deg,var(--acc),var(--acc2)); box-shadow:0 6px 18px var(--glow);
}
.brand h1{font-size:14px; font-weight:700; letter-spacing:-.02em}
.brand h1 small{display:block; font-size:10px; color:var(--dim); font-weight:400; margin-top:1px}
.nav{display:flex; flex-direction:column; gap:3px}
.nav .tab{
  display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:10px;
  color:var(--dim); cursor:pointer; font-weight:500; font-size:12px; user-select:none;
  border:1px solid transparent; transition:.15s;
}
.nav .tab:hover{background:var(--panel2); color:var(--text)}
.nav .tab.on{
  background:linear-gradient(135deg,rgba(79,140,255,.2),rgba(45,212,191,.08));
  color:var(--text); border-color:rgba(79,140,255,.28);
}
.nav .tab .ico{width:16px; text-align:center}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:7px}
.side-foot .meta{font-size:10px; color:var(--muted); padding:0 6px; font-family:var(--mono)}

.main{padding:14px 18px 40px; max-width:1280px; width:100%}
.topbar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.topbar h2{font-size:18px; font-weight:700; letter-spacing:-.03em}
.actions{display:flex; gap:7px; align-items:center; flex-wrap:wrap}
#refresh-note{font-size:11px; color:var(--muted); font-family:var(--mono)}
.pulse{width:8px; height:8px; border-radius:50%; background:var(--ok); animation:pulse 2s infinite}
.pulse.off{background:var(--muted); animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.4)}70%{box-shadow:0 0 0 9px transparent}}

.status-bar{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
.pill{
  display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px;
  background:var(--panel); border:1px solid var(--line); font-size:11px; color:var(--dim);
}
.pill b{color:var(--text); font-weight:600}
.pill.on{border-color:rgba(52,211,153,.4); color:var(--ok)}
.pill.err{border-color:rgba(248,113,113,.35); color:var(--danger)}

.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:12px 14px; box-shadow:var(--shadow);
}
.stat .label{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600}
.stat .val{font-size:22px; font-weight:700; margin-top:2px; font-family:var(--mono); letter-spacing:-.03em}
.stat .sub{font-size:10px; color:var(--dim); margin-top:1px}

.panel{display:none}
.panel.on{display:block}

.toolbar{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;
  padding:8px 10px; background:var(--panel); border:1px solid var(--line); border-radius:11px;
}
.toolbar .filters{display:flex; flex-wrap:wrap; gap:5px; align-items:center}
.toolbar .count{margin-left:auto; font-size:11px; color:var(--muted); font-family:var(--mono)}
.toolbar input[type=search]{flex:1; min-width:120px}
.toolbar select{font-size:11px; padding:6px 8px}

.mini-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; margin-bottom:12px}
.mini-stat{
  background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
}
.mini-stat .n{font-size:18px; font-weight:700; font-family:var(--mono)}
.mini-stat .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:2px}

.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px}
.tile{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:12px; display:flex; flex-direction:column; gap:6px;
  min-height:140px; max-height:200px; transition:border-color .15s, box-shadow .15s;
  box-shadow:var(--shadow);
}
.tile:hover{border-color:var(--line2)}
.tile .t{font-weight:600; font-size:13px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.tile .m{display:flex; flex-wrap:wrap; gap:5px; align-items:center; font-size:10px; color:var(--dim)}
.tile .preview{font-size:11px; color:var(--dim); line-height:1.4; flex:1; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.tile .foot{display:flex; justify-content:space-between; align-items:center; margin-top:auto; font-size:10px; color:var(--muted)}

.list .row{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; margin-bottom:7px; transition:border-color .15s;
  display:grid; grid-template-columns:1fr auto; gap:8px; align-items:start;
}
.list .row:hover{border-color:var(--line2)}
.list .row .t{font-weight:600; font-size:13px; margin-bottom:4px}
.list .row .m{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:11px; color:var(--dim)}
.list .row .preview{font-size:12px; color:var(--dim); margin-top:4px; grid-column:1/-1}
.list .row .side-meta{text-align:right; font-size:10px; color:var(--muted); font-family:var(--mono); white-space:nowrap}

/* Changes timeline */
.timeline{position:relative; padding-left:18px}
.timeline::before{content:''; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:var(--line)}
.timeline .row{position:relative}
.timeline .row::before{
  content:''; position:absolute; left:-15px; top:14px; width:8px; height:8px; border-radius:50%;
  background:var(--warn); border:2px solid var(--panel); box-shadow:0 0 0 2px rgba(251,191,36,.35);
}

.tag{
  display:inline-block; padding:1px 7px; border-radius:5px; font-size:10px; font-weight:500;
  background:var(--elev); border:1px solid var(--line); color:var(--dim);
}
.tag.ok{color:var(--ok); border-color:rgba(52,211,153,.35)}
.tag.warn{color:var(--warn); border-color:rgba(251,191,36,.35)}
.tag.crit{color:var(--danger); border-color:rgba(248,113,113,.4); background:rgba(248,113,113,.08)}
.tag.brics{color:var(--violet); border-color:rgba(196,181,253,.4)}
.tag.rss{color:var(--acc)}
.tag.page{color:var(--acc2)}
.score{font-family:var(--mono); font-size:10px; font-weight:600; color:var(--acc2); background:rgba(45,212,191,.1); padding:1px 6px; border-radius:5px}

.bar-row{display:grid; grid-template-columns:120px 1fr 40px; gap:8px; align-items:center; margin:5px 0}
.bar-label{font-size:11px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar-track{height:8px; background:var(--elev); border-radius:99px; overflow:hidden}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--acc),var(--acc2)); border-radius:99px; min-width:2px}
.bar-count{font-size:10px; color:var(--muted); font-family:var(--mono); text-align:right}

.two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media(max-width:800px){.two-col{grid-template-columns:1fr}}
.card-block{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:10px; box-shadow:var(--shadow)}
.card-block .t{font-weight:600; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center}

.empty,.error{text-align:center; padding:36px 16px; color:var(--muted)}
.error{color:var(--danger); border:1px solid rgba(248,113,113,.3); border-radius:var(--r); background:rgba(248,113,113,.06)}

.map-wrap{
  height:440px; border-radius:var(--r); overflow:hidden; border:1px solid var(--line);
  background:var(--panel); position:relative; box-shadow:var(--shadow);
}
#map{width:100%; height:100%; background:#0a101c}
.map-legend{
  position:absolute; bottom:10px; left:10px; z-index:500;
  background:rgba(14,22,38,.92); border:1px solid var(--line); border-radius:8px;
  padding:6px 10px; font-size:10px; color:var(--dim); max-width:200px;
}
html[data-theme="light"] .map-legend{background:rgba(255,255,255,.94)}
.map-controls{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}

.stream-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px}
.stream-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow)}
.stream-card iframe{width:100%; height:170px; border:0; display:block; background:#000}
.stream-card .meta{padding:10px 12px; display:flex; justify-content:space-between; align-items:center; gap:6px}
.stream-form{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; padding:12px; background:var(--panel); border:1px solid var(--line); border-radius:11px}
.stream-form input{flex:1; min-width:100px}

/* ===== ADVANCED CATEGORY / UX LAYER ===== */
.category-panel{margin-bottom:12px}
.category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:1050px){.category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:720px){.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.category-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;transition:.15s}
.category-card:hover,.category-card.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
.category-card .ctop{display:flex;justify-content:space-between;gap:8px;align-items:center}
.category-card .cname{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.category-card .ccount{font-family:var(--mono);font-size:11px;color:var(--acc2)}
.category-card .ctrack{height:4px;background:var(--elev);border-radius:99px;margin-top:8px;overflow:hidden}
.category-card .cfill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
.category-summary{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.category-summary .pill{cursor:pointer}
.category-summary .pill:hover{border-color:var(--acc)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 9px}
.section-head .t{font-weight:600}
.section-head .sub{font-size:10px;color:var(--muted)}
.compact-note{font-size:10px;color:var(--muted)}
.toast{
  position:fixed; bottom:20px; right:20px; z-index:9999;
  background:var(--panel); border:1px solid var(--line); border-radius:11px;
  padding:10px 16px; box-shadow:var(--shadow); font-size:12px;
  transform:translateY(100px); opacity:0; transition:.25s;
}
.toast.show{transform:translateY(0); opacity:1}
.toast.ok{border-color:rgba(52,211,153,.4)}
.toast.err{border-color:rgba(248,113,113,.4)}
.leaflet-popup-content-wrapper{background:var(--panel)!important; color:var(--text)!important; border-radius:9px!important}
.leaflet-popup-tip{background:var(--panel)!important}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo">GW</div>
      <h1>GeoWatch<small>intel monitor</small></h1>
    </div>
    <nav class="nav" id="nav">
      <div class="tab on" data-tab="content"><span class="ico">◉</span> Feed</div>
      <div class="tab" data-tab="sources"><span class="ico">◎</span> Sources</div>
      <div class="tab" data-tab="changes"><span class="ico">△</span> Changes</div>
      <div class="tab" data-tab="breakdown"><span class="ico">▦</span> Breakdown</div>
      <div class="tab" data-tab="weekly"><span class="ico">▣</span> Weekly</div>
      <div class="tab" data-tab="map"><span class="ico">🌐</span> Map</div>
      <div class="tab" data-tab="streams"><span class="ico">▶</span> Streams</div>
    </nav>
    <div class="side-foot">
      <div class="meta" id="side-status">collector —</div>
      <button type="button" id="btn-theme">◐ Theme</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h2 id="page-title">Feed</h2>
      <div class="actions">
        <span id="pulse" class="pulse" title="Collector"></span>
        <span id="refresh-note">—</span>
        <label style="display:flex;gap:5px;align-items:center;color:var(--dim);font-size:11px;cursor:pointer">
          <input type="checkbox" id="auto-refresh" checked style="width:auto"> Auto
        </label>
        <button type="button" id="btn-export">⬇ Export</button>
        <button type="button" class="primary" id="btn-refresh">↻ Refresh</button>
      </div>
    </div>
    <div class="status-bar" id="status-bar"></div>
    <div class="stats" id="stats">
      <div class="stat"><div class="label">Sources</div><div class="val">—</div></div>
      <div class="stat"><div class="label">Feed</div><div class="val">—</div></div>
      <div class="stat"><div class="label">Changes</div><div class="val">—</div></div>
      <div class="stat"><div class="label">Categories</div><div class="val">—</div></div>
    </div>
    <div class="panel on" id="panel-content"></div>
    <div class="panel" id="panel-sources"></div>
    <div class="panel" id="panel-changes"></div>
    <div class="panel" id="panel-breakdown"></div>
    <div class="panel" id="panel-weekly"></div>
    <div class="panel" id="panel-map">
      <div class="map-controls" id="map-controls"></div>
      <div class="map-wrap"><div id="map"></div><div class="map-legend" id="map-legend">Free map · no API key</div></div>
      <div id="map-side" style="margin-top:12px"></div>
    </div>
    <div class="panel" id="panel-streams"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const titles = {content:'Feed',sources:'Sources',changes:'Changes',breakdown:'Breakdown',weekly:'Weekly report',map:'World map',streams:'Live streams'};
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => { try { const x=new URL(String(u||''),location.origin); return ['http:','https:'].includes(x.protocol)?x.href:'#'; } catch(_) { return '#'; } };
const short = (s,n=120) => { s=String(s||''); return s.length>n ? s.slice(0,n-1)+'…' : s; };
const timeAgo = iso => {
  if(!iso) return '';
  const t=new Date(iso).getTime(); if(isNaN(t)) return '';
  const d=Math.max(0,(Date.now()-t)/1000);
  if(d<60) return Math.floor(d)+'s';
  if(d<3600) return Math.floor(d/60)+'m';
  if(d<86400) return Math.floor(d/3600)+'h';
  return Math.floor(d/86400)+'d';
};
const ts = iso => { const t=new Date(iso).getTime(); return isNaN(t)?0:t; };

async function fetchJSON(u){
  const r=await fetch(u);
  if(!r.ok) throw new Error(u+' → '+r.status);
  return r.json();
}
function toast(msg, kind){
  const el=$('toast'); el.textContent=msg; el.className='toast show '+(kind||'');
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),2600);
}

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(_) { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(_) {} }
};
function toggleTheme(){
  const h=document.documentElement;
  const next=h.getAttribute('data-theme')==='dark'?'light':'dark';
  h.setAttribute('data-theme',next); store.set('gw-theme',next);
  if(mapInst){ try{ mapInst.remove(); }catch(_){ } mapInst=null; if(activeTab==='map') setTimeout(ensureMap,80); }
}
(function(){ const s=store.get('gw-theme'); if(s) document.documentElement.setAttribute('data-theme',s); })();

let activeTab='content';
function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.nav .tab').forEach(x=>x.classList.toggle('on', x.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on', x.id==='panel-'+tab));
  $('page-title').textContent=titles[tab]||'GeoWatch';
  if(tab==='map') setTimeout(()=>{ ensureMap(); if(mapInst) mapInst.invalidateSize(); },50);
  if(tab==='sources') loadSources();
  if(tab==='changes') loadChanges();
  if(tab==='breakdown') loadBreakdown();
  if(tab==='weekly') loadWeekly();
  if(tab==='streams') loadStreams();
}

const CACHE={content:[],sources:[],changes:[],contentTotal:0,contentHasMore:false,points:[],chokepoints:[],summary:null,weekly:null};
let FILTER='all', CATEGORY_FILTER='all', SOURCE_FILTER='healthy', SOURCE_TYPE='all', SORT='newest', SRC_SORT='name', CHG_SORT='newest', MAP_MODE='regions';
let CONTENT_SKIP=0; const CONTENT_PAGE=60;
let mapInst=null;

function isCritical(it){
  if(it.critical) return true;
  const b=[it.title,it.name,it.content_preview,it.category].join(' ').toLowerCase();
  return /sanction|invasion|missile|nuclear|ceasefire|airstrike|martial law|escalation/.test(b);
}
function isBrics(it){
  if(it.brics) return true;
  const b=[it.title,it.name,it.content_preview,it.category].join(' ').toLowerCase();
  return /brics|new development bank|global south/.test(b);
}
function hasErr(it){ return !!(it.error||it.error_message); }
function sourceType(it){
  const t=(it.source_type||it.platform||'').toLowerCase();
  if(t.includes('rss')||(it.url||'').includes('rss')||(it.url||'').includes('feed')) return 'rss';
  if(t.includes('trend')||/reddit|hacker|youtube|mastodon/.test(t)) return 'trend';
  if(t.includes('onion')) return 'onion';
  return 'page';
}

/* Keep the underlying source taxonomy intact, but present it as 12 human-friendly groups. */
const CATEGORY_GROUPS=[
  ['Geopolitics',/geopolit|foreign|international|world|diplomacy|diplomatic/],
  ['Security',/security|defen[cs]e|military|war|conflict|terror|threat|nato|missile|nuclear/],
  ['Trade & Economy',/trade|econom|market|finance|business|tariff|investment|supply|shipping/],
  ['Sanctions',/sanction|ofac|embargo|export.?control/],
  ['Diplomacy',/diplomacy|diplomatic|summit|bilateral|ambassador|treaty/],
  ['Energy',/energy|oil|gas|pipeline|opec|electric|power/],
  ['Research',/research|science|academic|study|paper|university/],
  ['Technology',/tech|technology|ai|cyber|software|semiconductor|chip|space/],
  ['India & South Asia',/india|pakistan|bangladesh|sri.?lanka|nepal|bhutan|maldives|south.?asia/],
  ['Humanitarian',/humanitarian|refugee|aid|health|food|disaster|crisis|civilian/],
  ['Trends',/^trend|youtube|mastodon|hacker.?news|reddit|social/],
  ['Other',/.*/]
];
function displayCategory(value){
  const raw=String(value||'').trim();
  if(!raw) return 'Other';
  const low=raw.toLowerCase();
  for(const [name,re] of CATEGORY_GROUPS){ if(re.test(low)) return name; }
  return 'Other';
}
function groupedCategories(obj){
  const out={};
  for(const [k,v] of Object.entries(obj||{})){
    const g=displayCategory(k); out[g]=(out[g]||0)+(Number(v)||0);
  }
  return out;
}
function categoryList(){ return CATEGORY_GROUPS.map(x=>x[0]); }

function sortItems(items, mode){
  const arr=items.slice();
  if(mode==='newest') arr.sort((a,b)=> ts(b.updated_at||b.last_changed||b.last_checked||b.detected_at) - ts(a.updated_at||a.last_changed||a.last_checked||a.detected_at));
  else if(mode==='oldest') arr.sort((a,b)=> ts(a.updated_at||a.last_changed||a.last_checked||a.detected_at) - ts(b.updated_at||b.last_changed||b.last_checked||b.detected_at));
  else if(mode==='score') arr.sort((a,b)=> (b.score||0)-(a.score||0));
  else if(mode==='title') arr.sort((a,b)=> String(a.title||a.name||'').localeCompare(String(b.title||b.name||'')));
  else if(mode==='category') arr.sort((a,b)=> String(a.category||'').localeCompare(String(b.category||'')));
  else if(mode==='name') arr.sort((a,b)=> String(a.name||a.title||'').localeCompare(String(b.name||b.title||'')));
  else if(mode==='status') arr.sort((a,b)=> (b.last_status||0)-(a.last_status||0));
  else if(mode==='type') arr.sort((a,b)=> sourceType(a).localeCompare(sourceType(b)));
  return arr;
}

/* ===== FEED ===== */
function renderContent(){
  const el=$('panel-content'); if(!el) return;
  let items=CACHE.content||[];
  if(FILTER==='critical') items=items.filter(isCritical);
  if(FILTER==='brics') items=items.filter(isBrics);
  if(FILTER==='high') items=items.filter(it=>(it.score||0)>=5);
  if(FILTER==='rss') items=items.filter(it=>sourceType(it)==='rss');
  if(FILTER==='trend') items=items.filter(it=>sourceType(it)==='trend');
  if(CATEGORY_FILTER!=='all') items=items.filter(it=>displayCategory(it.category)===CATEGORY_FILTER);
  const qEl=$('q-content'); const q=(qEl&&qEl.value||'').toLowerCase().trim();
  if(q) items=items.filter(it=>[it.title,it.name,it.category,it.platform,it.content_preview,it.url].join(' ').toLowerCase().includes(q));
  items=sortItems(items, SORT);
  const tiles=items.slice(0,60).map(it=>{
    const title=it.title||it.name||it.url||'Untitled';
    const preview=it.content_preview||it.content||'';
    const tags=[
      it.category&&`<span class="tag">${esc(displayCategory(it.category))}</span>`,
      it.platform&&`<span class="tag">${esc(it.platform)}</span>`,
      isCritical(it)&&`<span class="tag crit">crit</span>`,
      isBrics(it)&&`<span class="tag brics">brics</span>`,
      (it.score||0)>0&&`<span class="score">${it.score}</span>`
    ].filter(Boolean).join('');
    return `<article class="tile">
      <div class="t"><a href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener">${esc(title)}</a></div>
      <div class="m">${tags}</div>
      ${preview?`<div class="preview">${esc(short(preview,140))}</div>`:''}
      <div class="foot"><span>${timeAgo(it.updated_at||it.last_changed||it.last_checked)} ago</span>
        <a href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener">Open →</a></div>
    </article>`;
  }).join('');
  const grouped=groupedCategories((CACHE.summary||{}).by_category||{});
  const catEntries=Object.entries(grouped).sort((a,b)=>b[1]-a[1]);
  const catMax=Math.max(1,...catEntries.map(x=>x[1]));
  const categoryHtml=catEntries.slice(0,12).map(([k,v])=>`<button type="button" class="category-card ${CATEGORY_FILTER===k?'on':''}" data-category="${esc(k)}"><div class="ctop"><span class="cname">${esc(k)}</span><span class="ccount">${v}</span></div><div class="ctrack"><div class="cfill" style="width:${v/catMax*100}%"></div></div></button>`).join('');
  el.innerHTML=`<div class="category-panel">
    <div class="section-head"><div class="t">Categories</div><div class="sub">${catEntries.length} groups · click to filter</div></div>
    <div class="category-grid">${categoryHtml||'<div class="empty" style="grid-column:1/-1">No category data yet.</div>'}</div>
  </div>
  <div class="toolbar">
    <input type="search" id="q-content" placeholder="Search feed…" value="${esc(q)}">
    <div class="filters" id="feed-filters">
      <button type="button" class="chip ${FILTER==='all'?'on':''}" data-filter="all">All</button>
      <button type="button" class="chip ${FILTER==='critical'?'on':''}" data-filter="critical">Critical</button>
      <button type="button" class="chip ${FILTER==='brics'?'on':''}" data-filter="brics">BRICS</button>
      <button type="button" class="chip ${FILTER==='high'?'on':''}" data-filter="high">High</button>
      <button type="button" class="chip ${FILTER==='rss'?'on':''}" data-filter="rss">RSS</button>
      <button type="button" class="chip ${FILTER==='trend'?'on':''}" data-filter="trend">Trends</button>
    </div>
    <select id="sort-content">
      <option value="newest" ${SORT==='newest'?'selected':''}>Newest</option>
      <option value="oldest" ${SORT==='oldest'?'selected':''}>Oldest</option>
      <option value="score" ${SORT==='score'?'selected':''}>Score ↓</option>
      <option value="title" ${SORT==='title'?'selected':''}>Title A–Z</option>
      <option value="category" ${SORT==='category'?'selected':''}>Category</option>
    </select>
    <span class="count">showing ${Math.min(items.length,60)}${CACHE.contentTotal?' / '+CACHE.contentTotal:''}</span>
  </div>
  <div class="grid">${tiles||'<div class="empty" style="grid-column:1/-1">No items — wait for a cycle or clear filters.</div>'}</div>
  ${CACHE.contentHasMore?`<div style="text-align:center;margin:12px 0"><button type="button" class="primary" id="btn-load-more">Load more</button></div>`:''}`;
  const qi=$('q-content'); if(qi) qi.addEventListener('input',()=>renderContent());
  const ff=$('feed-filters'); if(ff) ff.addEventListener('click',e=>{
    const b=e.target.closest('[data-filter]'); if(!b) return; FILTER=b.dataset.filter; renderContent();
  });
  el.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{ CATEGORY_FILTER=(CATEGORY_FILTER===b.dataset.category?'all':b.dataset.category); renderContent(); }));
  const so=$('sort-content'); if(so) so.addEventListener('change',()=>{ SORT=so.value; renderContent(); });
  const more=$('btn-load-more'); if(more) more.addEventListener('click',()=>loadContent(false));
}
async function loadContent(reset){
  try{
    if(reset!==false){ CONTENT_SKIP=0; CACHE.content=[]; }
    const data=await fetchJSON('/api/content?limit='+CONTENT_PAGE+'&skip='+CONTENT_SKIP);
    const items=Array.isArray(data)?data:(data.items||[]);
    const total=Array.isArray(data)?items.length:(data.total||items.length);
    CACHE.contentTotal=total;
    CACHE.contentHasMore=Array.isArray(data)?false:!!data.has_more;
    CACHE.content=reset===false?CACHE.content.concat(items):items;
    CONTENT_SKIP=CACHE.content.length;
    const si=$('stat-items'); if(si) si.textContent=total;
    renderContent();
  }catch(e){ $('panel-content').innerHTML=`<div class="error">${esc(e.message)}</div>`; }
}

/* ===== MAP ===== */
function ensureMap(){
  const mapEl=$('map'); if(!mapEl) return;
  if(mapInst){ try{ mapInst.invalidateSize(); }catch(_){ } return; }
  if(typeof L==='undefined'){ $('map-side').innerHTML='<div class="error">Leaflet failed to load. Check your internet connection and try Refresh.</div>'; return; }

  /*
   * GeoWatch map tiles:
   * Use the official OpenStreetMap raster endpoint directly.
   * No Mapbox/CARTO/Stadia token or API key is required.
   * Keep attribution visible as required by the tile provider.
   */
  mapInst=L.map('map',{
    worldCopyJump:true,
    minZoom:1,
    maxZoom:19,
    zoomControl:true,
    attributionControl:true
  }).setView([20,10],2);

  const tileLayer=L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution:'<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">&copy; OpenStreetMap contributors</a>',
      maxZoom:19,
      maxNativeZoom:19,
      updateWhenIdle:true,
      keepBuffer:2
    }
  ).addTo(mapInst);

  tileLayer.on('tileerror',()=>{
    const legend=$('map-legend');
    if(legend) legend.textContent='Map tiles could not be loaded. Check your internet connection.';
  });

  drawMapLayers();
  setTimeout(()=>mapInst.invalidateSize(),100);
}
function clearMarkers(){
  if(!mapInst) return;
  mapInst.eachLayer(layer=>{ if(layer instanceof L.CircleMarker) mapInst.removeLayer(layer); });
}
function drawMapLayers(){
  if(!mapInst) return;
  clearMarkers();
  if(MAP_MODE==='chokepoints' && CACHE.chokepoints.length){
    CACHE.chokepoints.forEach(cp=>{
      const lat=cp.lat||cp.latitude; const lon=cp.lon||cp.lng||cp.longitude;
      if(lat==null||lon==null) return;
      const mentions=cp.recent_mentions||0;
      const r=Math.max(7, Math.min(22, 7+mentions*2));
      L.circleMarker([lat,lon],{radius:r,color:'#fbbf24',weight:2,fillColor:'#f87171',fillOpacity:.55})
        .addTo(mapInst)
        .bindPopup(`<b>${esc(cp.name||cp.id)}</b><br>Mentions: ${mentions}<br>${esc(cp.region||cp.description||'')}`);
    });
    $('map-legend').textContent='Chokepoints · sized by recent mentions';
  } else {
    (CACHE.points||[]).forEach(p=>{
      if(p.lon==null||p.lat==null||(p.lon===0&&p.lat===0)) return;
      const r=Math.max(6,Math.min(20,6+(p.enabled||0)*1.4+(p.items||0)*0.02));
      L.circleMarker([p.lat,p.lon],{radius:r,color:'#4f8cff',weight:1.5,fillColor:'#2dd4bf',fillOpacity:.55})
        .addTo(mapInst)
        .bindPopup(`<b>${esc(p.name)}</b><br>On: ${p.enabled||0}/${p.sources||0}<br>Items: ${p.items||0}`);
    });
    $('map-legend').textContent='Regions · free tiles · no API key';
  }
}
async function loadMap(){
  try{
    const [geo, cps] = await Promise.all([
      fetchJSON('/api/geo'),
      fetchJSON('/api/chokepoints').catch(()=>[])
    ]);
    CACHE.points=geo.points||[];
    CACHE.chokepoints=Array.isArray(cps)?cps:(cps.points||[]);
    const points=CACHE.points;
    $('map-controls').innerHTML=`
      <button type="button" class="chip ${MAP_MODE==='regions'?'on':''}" id="map-reg">Regions (${points.length})</button>
      <button type="button" class="chip ${MAP_MODE==='chokepoints'?'on':''}" id="map-cp">Chokepoints (${CACHE.chokepoints.length})</button>
      <button type="button" class="chip" id="map-fit">Fit all</button>`;
    $('map-reg').onclick=()=>{ MAP_MODE='regions'; drawMapLayers(); loadMapSide(); $('map-reg').classList.add('on'); $('map-cp').classList.remove('on'); };
    $('map-cp').onclick=()=>{ MAP_MODE='chokepoints'; drawMapLayers(); loadMapSide(); $('map-cp').classList.add('on'); $('map-reg').classList.remove('on'); };
    $('map-fit').onclick=()=>{
      if(!mapInst) return;
      const layers=[]; mapInst.eachLayer(l=>{ if(l instanceof L.CircleMarker) layers.push(l); });
      if(layers.length) mapInst.fitBounds(L.featureGroup(layers).getBounds().pad(0.2));
    };
    loadMapSide();
    if(activeTab==='map'){ ensureMap(); drawMapLayers(); if(mapInst) setTimeout(()=>mapInst.invalidateSize(),60); }
  }catch(e){ $('map-side').innerHTML=`<div class="error">${esc(e.message)}</div>`; }
}
function loadMapSide(){
  if(MAP_MODE==='chokepoints' && CACHE.chokepoints.length){
    const sorted=[...CACHE.chokepoints].sort((a,b)=>(b.recent_mentions||0)-(a.recent_mentions||0));
    const max=Math.max(1,...sorted.map(c=>c.recent_mentions||0));
    $('map-side').innerHTML=`<div class="card-block"><div class="t">Trade chokepoints · recent story mentions</div>${
      sorted.slice(0,20).map(cp=>`<div class="bar-row"><div class="bar-label">${esc(cp.name||cp.id)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(cp.recent_mentions||0)/max*100}%;background:linear-gradient(90deg,#fbbf24,#f87171)"></div></div>
      <div class="bar-count">${cp.recent_mentions||0}</div></div>`).join('')
    }</div>`;
  } else {
    const points=CACHE.points||[];
    $('map-side').innerHTML=`<div class="card-block"><div class="t">Regions · ${points.length}</div>${
      points.slice(0,24).map(p=>`<div class="bar-row"><div class="bar-label">${esc(p.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,((p.enabled||0)+(p.items||0))*6)}%"></div></div>
      <div class="bar-count">${(p.enabled||0)}/${(p.sources||0)}</div></div>`).join('')||'—'
    }</div>`;
  }
}

/* ===== STREAMS ===== */
async function loadStreams(){
  try{
    const streams=await fetchJSON('/api/streams');
    const list=Array.isArray(streams)?streams:(streams.streams||[]);
    const cards=list.map(s=>{
      const name=s.name||'Stream'; const embed=s.embed||s.embed_url||''; const link=s.link||s.url||'#';
      return `<div class="stream-card">
        ${embed?`<iframe src="${esc(safeUrl(embed))}" allowfullscreen allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"></iframe>`
          :'<div class="empty" style="height:170px;padding:40px">No embed URL</div>'}
        <div class="meta">
          <div><b>${esc(name)}</b><div style="font-size:10px;color:var(--muted);margin-top:2px">${esc(s.country||'Live')}</div></div>
          <div style="display:flex;gap:5px">
            <a class="btn" href="${esc(safeUrl(link))}" target="_blank" rel="noopener" style="padding:5px 8px;font-size:11px">Open</a>
            <button type="button" class="btn stream-del" data-name="${esc(name)}" style="padding:5px 8px;font-size:11px">Remove</button>
          </div>
        </div>
      </div>`;
    }).join('');

    $('panel-streams').innerHTML=`
      <div class="mini-stats">
        <div class="mini-stat"><div class="n">${list.length}</div><div class="l">Streams</div></div>
        <div class="mini-stat"><div class="n">${list.filter(s=>s.embed||s.embed_url).length}</div><div class="l">With embed</div></div>
      </div>
      <div class="stream-form">
        <input type="text" id="st-name" placeholder="Name (e.g. Al Jazeera)">
        <input type="text" id="st-country" placeholder="Region">
        <input type="url" id="st-link" placeholder="YouTube live URL or video id" style="flex:2">
        <button type="button" class="primary" id="btn-add-stream">Add stream</button>
      </div>
      <div class="stream-grid">${cards||'<div class="empty" style="grid-column:1/-1">No live streams yet. Paste a YouTube live URL above.</div>'}</div>`;
    const add=$('btn-add-stream'); if(add) add.addEventListener('click',addStream);
    document.querySelectorAll('.stream-del').forEach(btn=>btn.addEventListener('click',()=>removeStream(btn.dataset.name)));
  }catch(e){ $('panel-streams').innerHTML=`<div class="error">${esc(e.message)}</div>`; }
}
async function addStream(){
  const name=($('st-name')&&$('st-name').value||'').trim();
  const country=($('st-country')&&$('st-country').value||'').trim()||'Custom';
  const link=($('st-link')&&$('st-link').value||'').trim();
  if(!name||!link){ toast('Name and link required','err'); return; }
  try{
    const r=await fetch('/api/streams',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,country,link})});
    const d=await r.json(); if(!d.ok){ toast(d.error||'Failed','err'); return; }
    toast('Stream added','ok'); await loadStreams();
  }catch(e){ toast(String(e.message||e),'err'); }
}
async function removeStream(name){
  if(!name) return;
  try{
    const r=await fetch('/api/streams/'+encodeURIComponent(name),{method:'DELETE'});
    const d=await r.json(); if(!d.ok){ toast(d.error||'Failed','err'); return; }
    toast('Removed','ok'); await loadStreams();
  }catch(e){ toast(String(e.message||e),'err'); }
}

async function exportJson(){
  try{
    toast('Exporting…');
    const data=await fetchJSON('/api/export?limit=5000');
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='geowatch-export.json'; a.click(); URL.revokeObjectURL(a.href);
    toast('Export ready','ok');
  }catch(e){ toast('Export failed: '+e.message,'err'); }
}

async function loadAll(){
  $('refresh-note').textContent='…';
  await Promise.all([loadStatus(),loadStats(),loadContent(true),loadSources(),loadChanges(),loadMap()]);
  if(activeTab==='breakdown') await loadBreakdown();
  if(activeTab==='weekly') await loadWeekly();
  if(activeTab==='streams') await loadStreams();
  $('refresh-note').textContent=new Date().toLocaleTimeString();
}

document.getElementById('nav').addEventListener('click',e=>{
  const tab=e.target.closest('.tab'); if(!tab) return; switchTab(tab.dataset.tab);
});
$('btn-theme').addEventListener('click',toggleTheme);
$('btn-export').addEventListener('click',exportJson);
$('btn-refresh').addEventListener('click',()=>{ loadAll(); toast('Refreshing…'); });

loadAll();
setInterval(()=>{ if($('auto-refresh')&&$('auto-refresh').checked) loadAll(); },30000);
window.GW={loadAll,switchTab,CACHE};
})();
</script>
